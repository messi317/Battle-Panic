name: Unzip Source Files
on: workflow_dispatch

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Unzip full_source.zip
        run: |
          if [ -f "full_source.zip" ]; then
            unzip -o full_source.zip -d full_source/
            rm full_source.zip
          fi

      - name: Unzip scripts.zip
        run: |
          if [ -f "scripts.zip" ]; then
            unzip -o scripts.zip -d src/scripts/
            rm scripts.zip
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzip full_source and scripts automatically" || echo "No changes to commit"
          git push
 
